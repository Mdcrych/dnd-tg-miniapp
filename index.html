<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D Character Builder</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>⚔️ D&D Character Builder</h1>
    </header>

    <!-- Step 1: Basic Info -->
    <section id="step-basic" class="step active">
      <h2>Шаг 1: Основное</h2>
      <label>Имя персонажа
        <input id="char-name" type="text" placeholder="Имя..." maxlength="40" />
      </label>
      <label>Раса
        <select id="char-race">
          <option value="">— Выберите расу —</option>
          <option value="human">Человек</option>
          <option value="elf">Эльф</option>
          <option value="dwarf">Дварф</option>
          <option value="halfling">Полурослик</option>
          <option value="dragonborn">Драконорождённый</option>
          <option value="gnome">Гном</option>
          <option value="half-elf">Полуэльф</option>
          <option value="tiefling">Тифлинг</option>
        </select>
      </label>
      <label>Класс
        <select id="char-class">
          <option value="">— Выберите класс —</option>
          <option value="barbarian">Варвар</option>
          <option value="bard">Бард</option>
          <option value="cleric">Жрец</option>
          <option value="druid">Друид</option>
          <option value="fighter">Воин</option>
          <option value="monk">Монах</option>
          <option value="paladin">Паладин</option>
          <option value="ranger">Следопыт</option>
          <option value="rogue">Плут</option>
          <option value="sorcerer">Чародей</option>
          <option value="warlock">Колдун</option>
          <option value="wizard">Волшебник</option>
        </select>
      </label>
      <label>Предыстория
        <select id="char-background">
          <option value="">— Выберите предысторию —</option>
          <option value="acolyte">Прислужник</option>
          <option value="criminal">Преступник</option>
          <option value="folk-hero">Народный герой</option>
          <option value="noble">Дворянин</option>
          <option value="sage">Мудрец</option>
          <option value="soldier">Солдат</option>
        </select>
      </label>
      <button id="btn-next-1" onclick="nextStep(2)">Далее →</button>
    </section>

    <!-- Step 2: Ability Scores -->
    <section id="step-abilities" class="step">
      <h2>Шаг 2: Характеристики</h2>
      <p class="hint">Бросьте 4d6 и уберите наименьший — или введите вручную (от 3 до 18)</p>
      <div id="ability-scores">
        <!-- Generated by JS -->
      </div>
      <button class="btn-roll" onclick="rollAllStats()">🎲 Бросить все (4d6 drop lowest)</button>
      <div id="points-display" class="hidden">
        Осталось очков: <span id="points-left">27</span>
      </div>
      <div class="nav-buttons">
        <button onclick="prevStep(1)">← Назад</button>
        <button id="btn-next-2" onclick="nextStep(3)">Далее →</button>
      </div>
    </section>

    <!-- Step 3: Dice Roller -->
    <section id="step-dice" class="step">
      <h2>Шаг 3: Бросок кубиков</h2>
      <div class="dice-grid">
        <button class="dice" onclick="rollDice(4)">d4</button>
        <button class="dice" onclick="rollDice(6)">d6</button>
        <button class="dice" onclick="rollDice(8)">d8</button>
        <button class="dice" onclick="rollDice(10)">d10</button>
        <button class="dice" onclick="rollDice(12)">d12</button>
        <button class="dice" onclick="rollDice(20)">d20</button>
        <button class="dice d100" onclick="rollDice(100)">d100</button>
      </div>
      <div id="dice-count-row">
        <label>Количество кубиков:
          <input id="dice-count" type="number" min="1" max="20" value="1" />
        </label>
      </div>
      <div id="roll-result" class="roll-result hidden"></div>
      <div id="roll-history" class="roll-history"></div>
      <div class="nav-buttons">
        <button onclick="prevStep(2)">← Назад</button>
        <button onclick="nextStep(4)">Далее →</button>
      </div>
    </section>

    <!-- Step 4: Summary & Validation -->
    <section id="step-summary" class="step">
      <h2>Шаг 4: Итог персонажа</h2>
      <div id="summary-content"></div>
      <div id="validation-errors" class="errors hidden"></div>
      <div id="validation-ok" class="success hidden">✅ Билд корректен!</div>
      <div class="nav-buttons">
        <button onclick="prevStep(3)">← Назад</button>
        <button id="btn-save" onclick="saveCharacter()" class="btn-primary">💾 Сохранить персонажа</button>
      </div>
    </section>

    <!-- Saved Characters -->
    <section id="step-saved" class="step">
      <h2>Сохранённые персонажи</h2>
      <div id="saved-list"></div>
      <button onclick="newCharacter()">➕ Новый персонаж</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
